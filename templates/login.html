<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie — NVR</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171717; color: #f4f4f4; font: 16px system-ui, sans-serif; }
        main { width: min(360px, calc(100% - 48px)); padding: 32px; background: #252525; border: 1px solid #3b3b3b; border-radius: 12px; text-align: center; }
        a { display: block; margin-top: 14px; padding: 12px; border-radius: 7px; color: white; text-decoration: none; background: #1769aa; }
        a.microsoft { background: #2f2f2f; border: 1px solid #666; }
        .error { color: #ffb4ab; }
    </style>
</head>
<body>
    <main>
        <h1>NVR</h1>
        <p>Zaloguj się, aby uzyskać dostęp do kamer i nagrań.</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        {% for provider in providers %}
            <a class="{{ provider }}" href="/login/{{ provider }}">
                Kontynuuj przez {{ "Google" if provider == "google" else "Microsoft" }}
            </a>
        {% endfor %}
    </main>
</body>
</html>
